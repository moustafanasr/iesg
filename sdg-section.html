<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore the 17 Sustainable Development Goals | iESG Advisory</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Explore Egypt and MENA performance across all 17 Sustainable Development Goals.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: site-matched dark explorer — goal rail on the left, one panel on the right; headline layer first, evidence collapsed below. */
:root{
  --bg:#0B1322; --panel:#111B2E; --panel2:#182540; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --fg:#F4F7FB; --fg2:#A9B5C7; --fg3:#7E8BA0; --eyebrow:#5BC0EB; --accent:#5EAE4E; --accent-ink:#0B1322;
  --focus:#5BC0EB;
  --s-green:#4DBB63; --s-yellow:#E9C84A; --s-orange:#F08A3E; --s-red:#E5484D; --s-gray:#7C8799;
  --good:#5ED07A; --bad:#FF7B7B; --warn:#F2C14E;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ar:"Tajawal","Poppins",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F6FA; --panel:#FFFFFF; --panel2:#EDF2F8; --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --fg:#0F172A; --fg2:#4B5A73; --fg3:#6B7A93; --eyebrow:#1778A4; --accent:#3E8A33; --accent-ink:#FFFFFF; --focus:#1778A4;
  --s-green:#2E8B45; --s-yellow:#C9A227; --s-orange:#D9731E; --s-red:#C62828; --s-gray:#8A94A6;
  --good:#1F7A3A; --bad:#B42318; --warn:#9A6B00; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F3F6FA; --panel:#FFFFFF; --panel2:#EDF2F8; --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --fg:#0F172A; --fg2:#4B5A73; --fg3:#6B7A93; --eyebrow:#1778A4; --accent:#3E8A33; --accent-ink:#FFFFFF; --focus:#1778A4;
  --s-green:#2E8B45; --s-yellow:#C9A227; --s-orange:#D9731E; --s-red:#C62828; --s-gray:#8A94A6;
  --good:#1F7A3A; --bad:#B42318; --warn:#9A6B00; color-scheme:light; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
body[dir="rtl"]{font-family:var(--font-ar);font-size:15px}
.wrap{max-width:1180px;margin:0 auto;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--eyebrow)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.top > div:first-child{flex:1 1 420px;min-width:0;max-width:760px}
.topright{flex:0 0 auto}
.eyebrow{color:var(--eyebrow);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.top h1{font-size:clamp(24px,3vw,36px);font-weight:700;margin-top:6px}
.top p{color:var(--fg2);margin:8px 0 0;max-width:62ch}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
body[dir="rtl"] .topright{align-items:flex-start}
.counter{font-size:30px;font-weight:600;line-height:1}
.counter small{font-size:14px;color:var(--fg2);font-weight:500}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg2);font:inherit;font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--fg3)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2)}
.tag.draft{color:var(--warn);border-color:currentColor}

/* two columns */
.grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.rail{position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:6px;padding-inline-end:4px}
@media (max-width:760px){.rail{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}}
.goal-btn{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font:inherit;font-size:12px;line-height:1.25;padding:9px 10px;border-radius:10px;cursor:pointer;min-width:0;border-inline-start:3px solid var(--line)}
@media (max-width:760px){.goal-btn{flex:0 0 170px;scroll-snap-align:start}}
.goal-btn b{font-weight:700;font-size:12px}
.goal-btn:hover{border-color:var(--line2)}
.goal-btn[aria-current="true"]{border-color:var(--gc);border-inline-start-color:var(--gc);background:var(--panel2)}
.goal-btn .dot{display:none}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
@media (max-width:760px){.panel{padding:16px;border-radius:14px}}
.ghead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding-bottom:18px;border-bottom:1px solid var(--line)}
.gnum{font-size:64px;font-weight:700;line-height:.9;color:var(--gc);letter-spacing:-.02em}
@media (max-width:760px){.gnum{font-size:44px}}
.gtitle h2{font-size:clamp(20px,2.6vw,28px)}
.gtitle p{margin:6px 0 0;color:var(--fg2)}
.gmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;color:var(--fg3);font-size:12px}

section.block{margin-top:22px}
.block > h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.block > h3 .src{font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg3);font-size:11px}

/* position strip */
.pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.pos{grid-template-columns:1fr}}
.pos .card{background:var(--panel2);border-radius:12px;padding:12px 14px;min-width:0}
.card .lbl{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.card .big{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.card .big small{font-size:13px;color:var(--fg2);font-weight:500}
.card .sub{color:var(--fg2);font-size:12.5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block;flex:0 0 auto}
.chip.rating{margin-top:8px}
.trend{font-size:13px;color:var(--fg2)}
.trend b{color:var(--fg);font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:1fr}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--fg2);line-height:1.35;min-height:2.7em}
.kpi .val{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.01em}
.kpi .val small{font-size:13px;font-weight:500;color:var(--fg2);margin-inline-start:4px}
.kpi .val.na{font-size:16px;color:var(--fg3);font-weight:600}
.kpi .base{font-size:12px;color:var(--fg3)}
.assess{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;align-self:flex-start;padding:2px 8px;border-radius:6px;border:1px solid currentColor}
.assess.improving{color:var(--good)} .assess.worsening{color:var(--bad)} .assess.flat{color:var(--fg2)} .assess.no_baseline,.assess.not_available{color:var(--fg3);border-style:dashed}

/* peer chart */
.chart{border:1px solid var(--line);border-radius:12px;padding:14px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:4px 0;min-width:0}
@media (max-width:560px){.bar-row{grid-template-columns:110px minmax(0,1fr) 40px}}
.bar-row .name{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row.focus .name{color:var(--fg);font-weight:700}
.track{height:12px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--sc);border-radius:0 4px 4px 0}
body[dir="rtl"] .fill{border-radius:4px 0 0 4px}
.bar-row.focus .track{outline:2px solid var(--fg);outline-offset:1px}
.bar-row .v{font-size:12px;text-align:end;color:var(--fg2)}
.bar-row.focus .v{color:var(--fg);font-weight:700}
.bar-row .na{font-size:11.5px;color:var(--fg3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--fg2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sc);display:inline-block}
@media (max-width:560px){}
.leaders{font-size:12.5px;color:var(--fg2);margin-top:10px}
.leaders b{color:var(--fg);font-weight:600}

/* observations */
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.obs li{display:grid;grid-template-columns:22px 1fr;gap:10px;background:var(--panel2);border-radius:12px;padding:12px 14px;max-width:none}
.obs li span.n{font-weight:700;color:var(--gc);font-size:14px;line-height:1.5}
.obs li p{margin:0;max-width:78ch}

/* evidence */
details.ev{border:1px solid var(--line2);border-radius:14px;margin-top:22px;background:transparent}
details.ev > summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
details.ev > summary::-webkit-details-marker{display:none}
details.ev > summary .hint{font-weight:500;color:var(--fg3);font-size:12px}
details.ev > summary::after{content:"+";font-size:20px;color:var(--fg2);font-weight:400}
details.ev[open] > summary::after{content:"–"}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 18px 18px}
@media (max-width:900px){.evgrid{grid-template-columns:1fr}}
.box{background:var(--panel2);border-radius:12px;padding:14px;min-width:0}
.box.wide{grid-column:1/-1}
.box h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tr.focus td{font-weight:700}
td.code{font-weight:600;white-space:nowrap}
.stmt{margin:0 0 8px;max-width:78ch}
.stmt sup{color:var(--fg3);font-size:10px;margin-inline-start:3px}
.caveat{color:var(--fg2);font-size:12.5px;margin:10px 0 0;max-width:78ch;border-inline-start:2px solid var(--line2);padding-inline-start:10px}
.foot{color:var(--fg3);font-size:11.5px;margin:8px 0 0}
.mlist{margin:0 0 8px;padding:0;list-style:none;font-size:12px;color:var(--fg2)}
.mlist b{color:var(--fg);font-weight:600}
.srcs{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.srcs .note{color:var(--fg3)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pagefoot{margin-top:28px;color:var(--fg3);font-size:12px;max-width:90ch}
.pagefoot a{color:var(--fg2)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>

.1%).","ارتفع نقص التغذية من 6.5% إلى 8.4% وانعدام الأمن الغذائي المتوسط أو الشديد من 27.8% إلى 29.9% في الفترة نفسها، وكلاهما يبتعد عن الغاية؛ بينما تسجل تونس 2.8% و24.2%.","يصنّف تقرير التنمية المستدامة 2026 مصر ضمن «تحديات كبيرة متبقية» مع اتجاه ركود (درجة 67.3)، بمستوى المغرب (66.6) ومتقدمة على تونس والأردن والسعودية؛ ولا تحصل أي دولة في المجموعة على تصنيف أفضل من البرتقالي في الهدف 2."]}},"evidence":{"targets":[{"code":"2.1","summary":{"en":"End hunger and ensure year round access to nutritious food","ar":"إنهاء الجوع وضمان الغذاء المغذي طوال العام"},"original_date":"2030"},{"code":"2.2","summary":{"en":"End all malnutrition including child stunting and wasting","ar":"إنهاء سوء التغذية بما يشمل تقزم الأطفال والهزال"},"original_date":"2030 / 2025"},{"code":"2.3","summary":{"en":"Double small producer agricultural productivity and incomes","ar":"مضاعفة إنتاجية صغار المنتجين الزراعيين ودخولهم"},"original_date":"2030"},{"code":"2.4","summary":{"en":"Ensure sustainable resilient agriculture and protect ecosystems and soils","ar":"ضمان الزراعة المستدامة والصامدة وحماية النظم البيئية والتربة"},"original_date":"2030"},{"code":"2.5","summary":{"en":"Maintain genetic diversity of seeds crops and farm animals","ar":"الحفاظ على التنوع الجيني للبذور والمحاصيل وحيوانات المزرعة"},"original_date":"2020"},{"code":"2.a","summary":{"en":"Increase investment in rural infrastructure research extension and technology","ar":"زيادة الاستثمار في البنية الريفية والبحث والإرشاد والتكنولوجيا"},"original_date":null},{"code":"2.b","summary":{"en":"Correct agricultural trade distortions including export subsidies","ar":"تصحيح تشوهات التجارة الزراعية بما فيها دعم الصادرات"},"original_date":null},{"code":"2.c","summary":{"en":"Improve food market information and limit extreme price volatility","ar":"تحسين معلومات أسواق الغذاء والحد من تقلب الأسعار الحاد"},"original_date":null}],"egypt_performance":{"statements":[{"text":{"en":"Prevalence of undernourishment: 8.4 % in 2024, compared with 6.5 in ة 94.8، تحسن معتدل)، بمستوى المغرب فعليًا (95.0، أخضر) وتونس (93.1)؛ وتُصنَّف دول الخليج بالأحمر (السعودية 33.6، الإمارات 11.3) لأن التقرير يقيس الهدف 13 بالأساس عبر انبعاثات CO₂ للفرد."]}},"evidence":{"targets":[{"code":"13.1","summary":{"en":"Strengthen resilience and adaptation to climate hazards and disasters","ar":"تعزيز الصمود والتكيف مع الأخطار المناخية والكوارث"},"original_date":null},{"code":"13.2","summary":{"en":"Integrate climate measures into policies strategies and planning","ar":"إدماج إجراءات المناخ بالسياسات والاستراتيجيات والتخطيط"},"original_date":null},{"code":"13.3","summary":{"en":"Improve climate education awareness capacity and early warning","ar":"تحسين تعليم المناخ والوعي والقدرات والإنذار المبكر"},"original_date":null},{"code":"13.a","summary":{"en":"Implement developed countries 100 billion dollar annual commitment and operationalize Green Climate Fund","ar":"تنفيذ التزام الدول المتقدمة بمائة مليار دولار سنويًا وتفعيل صندوق المناخ الأخضر"},"original_date":"2020"},{"code":"13.b","summary":{"en":"Build climate planning capacity in least developed countries and small island states","ar":"تنمية قدرات التخطيط المناخي بأقل البلدان نموًا والدول الجزرية الصغيرة"},"original_date":null}],"egypt_performance":{"statements":[{"text":{"en":"Total greenhouse gas emissions without LULUCF: 386.21 million tonnes CO₂e in 2022, compared with 337.64 in 2020.","ar":"إجمالي انبعاثات غازات الدفيئة باستثناء استخدام الأراضي وتغيره والغابات: 386.21 مليون طن مكافئ CO₂ في 2022، مقارنة بـ337.64 في 2020."},"source_ref":"13.1"},{"text":{"en":"Score of adoption and implementation of national DRR strategies in line with the Sendai Framework: 0.825 score from 0 to 1 in 2024, compared with 0.6 in 2015.","ar":"درجة تنفيذ الاستراتيجيات الوطنية لخفض مخاطر الكوارث: 0.825 درجة من صفر إلى واحد في 2024، مقارنة بـ0.6 في 2015."},"source_ref":"13.2"},{"text":{"en":"Number of deaths and missing persons attributed to disasters per 100,000 population: 0.539 per 100000 people in 2024, co istics":{"rows":[{"id":"M1","label":{"en":"Proportion of individuals using the Internet","ar":"الأفراد المستخدمون للإنترنت"},"indicator_code":"17.8.1","series_code":"IT_USE_ii99","source_ref":"17.1","unit":{"en":"%","ar":"%"},"latest":{"value":74.6,"year":2024,"year_differs":false},"baseline":{"value":37.8,"year":2015,"year_differs":false},"assessment":"improving","data_nature":{"en":"Estimated","ar":"تقديرية"}},{"id":"M2","label":{"en":"Debt service as a proportion of exports of goods, services and primary income","ar":"خدمة الدين من صادرات السلع والخدمات والدخل الأولي"},"indicator_code":"17.4.1","series_code":"DT_TDS_DECT","source_ref":"17.2","unit":{"en":"%","ar":"%"},"latest":{"value":27.13,"year":2023,"year_differs":false},"baseline":{"value":9.44,"year":2015,"year_differs":false},"assessment":"worsening","data_nature":{"en":"Global monitoring","ar":"رصد عالمي"}},{"id":"M3","label":{"en":"Volume of remittances (in United States dollars) as a proportion of total GDP","ar":"التحويلات المالية من الناتج المحلي"},"indicator_code":"17.3.2","series_code":"BX_TRF_PWKR","source_ref":"17.3","unit":{"en":"%","ar":"%"},"latest":{"value":7.6,"year":2024,"year_differs":false},"baseline":{"value":5.56,"year":2015,"year_differs":false},"assessment":"improving","data_nature":{"en":"Global monitoring","ar":"رصد عالمي"}}],"breakdowns":[]},"sources":[{"ref":"17.1","custodian":"ITU estimate","series_code":"IT_USE_ii99","url":"https://unstats.un.org/SDGAPI/v1/sdg/Series/Data?seriesCode=IT_USE_ii99&areaCode=818&areaCode=504&areaCode=788&areaCode=400&areaCode=682&pageSize=10000","note":null},{"ref":"17.2","custodian":"World Bank","series_code":"DT_TDS_DECT","url":"https://unstats.un.org/SDGAPI/v1/sdg/Series/Data?seriesCode=DT_TDS_DECT&areaCode=818&areaCode=504&areaCode=788&areaCode=400&areaCode=682&pageSize=10000","note":null},{"ref":"17.3","custodian":"World Bank","series_code":"BX_TRF_PWKR","url":"https://unstats.un.org/SDGAPI/v1/sdg/Series/Data?seriesCode=BX_TRF_PWKR&areaCode=818&a <script>
(function(){
  const DATA = JSON.parse(document.getElementById('sdg-data').textContent);
  const GOALS = DATA.goals, META = DATA.meta;
  const I18N = {
    en:{eyebrow:'Global goals',h1:'Explore the 17 Sustainable Development Goals.',sub:'Select a goal to see where Egypt stands, how it compares in the region, and the evidence behind it.',proto:'Egypt & MENA data explorer',
        where:'Where Egypt stands',global:'Global · SDR 2026',regional:'Arab region · Arab Index 2026',panel:'Peer panel · this goal',of:'of',score:'score',regavg:'regional average',top7:'Among 7 of 22 Arab states above the two-thirds threshold',
        rankNA:'Rank: in report chart (to fill)',kpis:'Key figures',kpisrc:'UN SDG Indicators Database',from:'from',in:'in',peer:'Egypt vs regional peers',peersrc:'SDR 2026 goal score, 0–100',
        leaders:'Leads this goal in the region:',gleaders:'Global index leaders:',obs:'Key observations',draft:'Draft · for review',evidence:'Full evidence',evhint:'Targets · Egypt performance · MENA comparison · Statistics & sources',
        targets:'Targets',code:'Code',target:'Target',date:'Original date',unspec:'Unspecified',official:'Official target and indicator text',perf:'Egypt performance',mena:'MENA comparison',country:'Country',
        menafoot:'',stats:'Statistics & indicators',ind:'Indicator',latest:'Latest',baseline:'Baseline',nature:'Data nature',bd:'Egypt breakdowns, same year',group:'Group',value:'Value',unit:'Unit',sources:'Sources & technical notes',data:'Original data',
        na:'Not available',prev:'← Previous goal',next:'Next goal →',asof:'Data as of',status:'Status',
        foot:'Evidence layer: UN Global SDG Indicators Database, retrieved 13 Oct 2026 (as in the SDG_17_Egypt_MENA reference). Position layer: SDSN Sustainable Development Report 2026 (23 Jun 2026, 169 countries) and the Arab Region SDG Index & Dashboards 2026 (MBRSG/SDSN). Index scores and UN indicator values are never shown in the same table.'},
    ar:{eyebrow:'الأهداف العالمية',h1:'استكشف أهداف التنمية المستدامة السبعة عشر.',sub:'اختر هدفًا لترى موقع مصر، ومقارنتها إقليميًا، والأدلة الداعمة.',proto:'مستكشف بيانات مصر والمنطقة',
        where:'أين تقف مصر',global:'عالميًا · تقرير التنمية المستدامة 2026',regional:'المنطقة العربية · المؤشر العربي 2026',panel:'مجموعة المقارنة · هذا الهدف',of:'من',score:'الدرجة',regavg:'متوسط المنطقة',top7:'ضمن 7 من 22 دولة عربية تجاوزت عتبة الثلثين',
        rankNA:'الترتيب: في رسم التقرير (يُستكمل)',kpis:'الأرقام الرئيسية',kpisrc:'قاعدة بيانات مؤشرات التنمية المستدامة – الأمم المتحدة',from:'من',in:'في',peer:'مصر مقابل دول المنطقة',peersrc:'درجة الهدف في تقرير 2026، من 0 إلى 100',
        leaders:'تتصدر هذا الهدف إقليميًا:',gleaders:'المتصدرون عالميًا:',obs:'ملاحظات رئيسية',draft:'مسودة · للمراجعة',evidence:'الأدلة الكاملة',evhint:'الغايات · أداء مصر · المقارنة الإقليمية · الإحصاءات والمصادر',
        targets:'الغايات',code:'الرمز',target:'الغاية',date:'الموعد الأصلي',unspec:'غير محدد',official:'النص الرسمي للغايات والمؤشرات',perf:'أداء مصر',mena:'المقارنة مع الشرق الأوسط وشمال أفريقيا',country:'الدولة',
        menafoot:'',stats:'الإحصاءات والمؤشرات',ind:'المؤشر',latest:'الأحدث',baseline:'الأساس',nature:'طبيعة البيان',bd:'تفصيلات مصر لنفس السنة',group:'الفئة',value:'القيمة',unit:'الوحدة',sources:'المصادر والملاحظات الفنية',data:'البيانات الأصلية',
        na:'غير متاح',prev:'→ الهدف السابق',next:'الهدف التالي ←',asof:'البيانات حتى',status:'الحالة',
        foot:'طبقة الأدلة: قاعدة بيانات مؤشرات التنمية المستدامة للأمم المتحدة، استُخرجت في 13 أكتوبر 2026 (كما في مرجع SDG_17_Egypt_MENA). طبقة الموقع: تقرير التنمية المستدامة 2026 (23 يونيو 2026، 169 دولة) ومؤشر ولوحات أهداف التنمية المستدامة للمنطقة العربية 2026. لا تُعرض درجات المؤشرات وقيم مؤشرات الأمم المتحدة في جدول واحد أبدًا.'}
  };
  let lang = 'en', cur = 1;
  try { const s = localStorage.getItem('sdg-lang'); if (s === 'ar' || s === 'en') lang = s; } catch(e){}
  const m = location.hash.match(/^#goal-(\d{1,2})$/); if (m) { const n = +m[1]; if (n >= 1 && n <= 17) cur = n; }

  const t = k => I18N[lang][k];
  const bi = o => (o == null ? '' : (typeof o === 'string' ? o : (o[lang] ?? o.en ?? '')));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const SC = {green:'var(--s-green)',yellow:'var(--s-yellow)',orange:'var(--s-orange)',red:'var(--s-red)',gray:'var(--s-gray)'};
  const fmtNum = v => (v == null ? '' : (Number.isInteger(v) ? String(v) : String(v)));
  function fmtObs(o){ // comparison / statistics value object
    if (!o) return `<span class="na">${t('na')}</span>`;
    if (o.flag) return `<span class="na">${esc(bi(META.legend.flags[o.flag]))}</span>`;
    return `<span class="num">${esc(o.qualifier||'')}${fmtNum(o.value)} (${o.year})${o.year_differs ? ' *' : ''}</span>`;
  }

  function renderRail(){
    const rail = document.getElementById('rail');
    rail.innerHTML = GOALS.map(g => `<button type="button" class="goal-btn" style="--gc:${g.color}" data-goal="${g.goal}" aria-current="${g.goal===cur}"><b class="num">${pad(g.goal)}</b><span>${esc(bi(g.title))}</span></button>`).join('');
    rail.querySelectorAll('button').forEach(b => b.addEventListener('click', () => select(+b.dataset.goal)));
  }

  function renderPanel(){
    const g = GOALS[cur-1], H = g.headline, E = g.evidence, P = H.position;
    const gl = P.global, rg = P.regional, pp = P.peer_panel;
    const kpis = H.kpis.map(k => {
      const na = k.value == null;
      const val = na ? `<div class="val na">${k.flag ? esc(bi(META.legend.flags[k.flag])) : t('na')}</div>`
                     : `<div class="val num">${esc(k.qualifier||'')}${fmtNum(k.value)}<small>${esc(bi(k.unit))}</small></div>`;
      const base = k.baseline != null ? `${t('from')} <span class="num">${fmtNum(k.baseline)}</span> ${t('in')} <span class="num">${k.baseline_year}</span>` : '';
      return `<div class="kpi"><div class="lbl">${esc(bi(k.label))}</div>${val}<div class="base num">${k.year ? `${k.year}` : ''}${base ? ' · ' + base : ''}</div><span class="assess ${k.assessment}">${esc(bi(k.assessment_label))}</span></div>`;
    }).join('');

    const ranked = pp.countries.slice().sort((a,b) => (b.goal_score ?? -1) - (a.goal_score ?? -1));
    const bars = ranked.map(c => {
      const sc = SC[c.goal_rating.code];
      const v = c.goal_score == null ? `<span class="na">${t('na')}</span>` : `<span class="num">${c.goal_score.toFixed(1)}</span>`;
      return `<div class="bar-row${c.is_focus?' focus':''}" title="${esc(bi(c.country))}: ${c.goal_score==null?t('na'):c.goal_score.toFixed(1)} · ${esc(bi(c.goal_rating))} · ${esc(bi(c.goal_trend))}">
        <span class="name">${esc(bi(c.country))}</span><div class="track"><div class="fill" style="--sc:${sc};width:${c.goal_score==null?0:c.goal_score}%"></div></div><span class="v">${v}</span></div>`;
    }).join('');
    const legend = ['green','yellow','orange','red','gray'].map(r => `<span><i style="--sc:${SC[r]}"></i>${esc(bi(META.legend.rating[r]))}</span>`).join('');
    const rl = P.leaders.regional_on_this_goal.map(x => `<b>${esc(bi(x.country))}</b> ${x.goal_score.toFixed(1)}`).join(' · ');
    const gl3 = P.leaders.global_index.map(x => `<b>${esc(bi(x.country))}</b> ${x.index_score.toFixed(1)}`).join(' · ');

    const obs = H.observations[lang].map((o,i) => `<li><span class="n num">${i+1}</span><p>${esc(o)}</p></li>`).join('');

    const targets = E.targets.map(x => `<tr><td class="code num">${esc(x.code)}</td><td>${esc(bi(x.summary))}</td><td class="num">${x.original_date ? esc(x.original_date) : `<span class="na">${t('unspec')}</span>`}</td></tr>`).join('');
    const stmts = E.egypt_performance.statements.map(s => `<p class="stmt">${esc(bi(s.text))}<sup class="num">[${s.source_ref}]</sup></p>`).join('')
                + E.egypt_performance.caveats.map(c => `<p class="caveat">${esc(bi(c))}</p>`).join('');
    const mlist = E.mena_comparison.measures.map(mm => `<li><b>${mm.id}</b> ${esc(bi(mm.label))} — ${esc(bi(mm.unit))}</li>`).join('');
    const mrows = E.mena_comparison.rows.map(r => `<tr class="${r.is_focus?'focus':''}"><td>${esc(bi(r.country))}</td><td>${fmtObs(r.M1)}</td><td>${fmtObs(r.M2)}</td><td>${fmtObs(r.M3)}</td></tr>`).join('');
    const srows = E.statistics.rows.map(s => `<tr><td><b>${s.id}</b> ${esc(bi(s.label))}<br><span class="num" style="color:var(--fg3);font-size:11px">${esc(s.indicator_code)} | ${esc(s.series_code)} [${s.source_ref}] · ${esc(bi(s.unit))}</span></td><td>${fmtObs(s.latest)}</td><td>${fmtObs(s.baseline)}</td><td>${s.data_nature ? esc(bi(s.data_nature)) : `<span class="na">${t('na')}</span>`}</td></tr>`).join('');
    const bd = E.statistics.breakdowns.length ? `<h4 style="margin-top:14px">${t('bd')}</h4><div class="tbl"><table><thead><tr><th>${t('group')}</th><th>${t('value')}</th><th>${t('unit')}</th></tr></thead><tbody>${E.statistics.breakdowns.map(b => `<tr><td><b>${b.measure}</b> ${esc(bi(b.group))}</td><td class="num">${fmtNum(b.value)} (${b.year})</td><td>${esc(bi(b.unit))}</td></tr>`).join('')}</tbody></table></div>` : '';
    const srcs = E.sources.map(s => `<li><span class="num">[${s.ref}]</span> ${esc(s.custodian)}. <a href="${esc(s.url)}" target="_blank" rel="noopener">${t('data')} ${esc(s.series_code)}</a>${s.note ? ` <span class="note">${esc(bi(s.note))}</span>` : ''}</li>`).join('');

    document.getElementById('panel').innerHTML = `
      <div class="ghead" style="--gc:${g.color}">
        <div class="gnum num">${pad(g.goal)}</div>
        <div class="gtitle"><h2>${esc(bi(g.title))}</h2><p>${esc(bi(g.tagline))}</p>
          <div class="gmeta"><span class="tag draft">${esc(g.status)}</span><span>${t('asof')} <span class="num">${g.data_as_of}</span></span><a href="${esc(g.official_url)}" target="_blank" rel="noopener">${t('official')}</a></div></div>
      </div>

      <section class="block"><h3>${t('where')}</h3>
        <div class="pos">
          <div class="card"><div class="lbl">${t('global')}</div><div class="big num">${gl.index_rank} <small>${t('of')} ${gl.index_total} · ${t('score')} ${gl.index_score}</small></div>
            <span class="chip rating" style="--sc:${SC[gl.goal_rating.code]}"><i></i>${esc(bi(gl.goal_rating))}</span>
            <div class="sub trend">${esc(bi(gl.goal_trend.symbol))} <b>${esc(bi(gl.goal_trend))}</b> · ${t('score')} <span class="num">${gl.goal_score==null?t('na'):gl.goal_score.toFixed(1)}</span></div></div>
          <div class="card"><div class="lbl">${t('regional')}</div><div class="big num">${rg.index_score} <small>${t('regavg')} ${rg.regional_average}</small></div>
            <div class="sub">${t('top7')}</div><div class="sub" style="color:var(--warn)">${t('rankNA')}</div></div>
          <div class="card"><div class="lbl">${t('panel')}</div><div class="big num">${pp.egypt_position_in_panel==null?t('na'):pp.egypt_position_in_panel} <small>${t('of')} ${pp.panel_size}</small></div>
            <div class="sub">${t('leaders')} ${rl}</div></div>
        </div>
      </section>

      <section class="block"><h3>${t('kpis')} <span class="src">${t('kpisrc')}</span></h3><div class="kpis">${kpis}</div></section>

      <section class="block"><h3>${t('peer')} <span class="src">${t('peersrc')}</span></h3>
        <div class="chart">${bars}<div class="legend">${legend}</div><div class="leaders">${t('gleaders')} ${gl3}</div></div>
      </section>

      <section class="block"><h3>${t('obs')} <span class="tag draft">${t('draft')}</span></h3><ol class="obs" style="--gc:${g.color}">${obs}</ol></section>

      <details class="ev"><summary><span>${t('evidence')}</span><span class="hint">${t('evhint')}</span></summary>
        <div class="evgrid">
          <div class="box"><h4>${t('targets')}</h4><div class="tbl"><table><thead><tr><th>${t('code')}</th><th>${t('target')}</th><th>${t('date')}</th></tr></thead><tbody>${targets}</tbody></table></div></div>
          <div class="box"><h4>${t('perf')}</h4>${stmts}</div>
          <div class="box wide"><h4>${t('mena')}</h4><ul class="mlist">${mlist}</ul><div class="tbl"><table><thead><tr><th>${t('country')}</th><th>M1</th><th>M2</th><th>M3</th></tr></thead><tbody>${mrows}</tbody></table></div><p class="foot">${esc(bi(E.mena_comparison.footnote))}</p></div>
          <div class="box wide"><h4>${t('stats')}</h4><div class="tbl"><table><thead><tr><th>${t('ind')}</th><th>${t('latest')}</th><th>${t('baseline')}</th><th>${t('nature')}</th></tr></thead><tbody>${srows}</tbody></table></div>${bd}</div>
          <div class="box wide"><h4>${t('sources')}</h4><ul class="srcs">${srcs}</ul></div>
        </div>
      </details>

      <div class="nav"><button type="button" class="btn" id="prev" ${cur===1?'disabled':''}>${t('prev')}</button><button type="button" class="btn" id="next" ${cur===17?'disabled':''}>${t('next')}</button></div>`;
    document.getElementById('prev').addEventListener('click', () => select(cur-1));
    document.getElementById('next').addEventListener('click', () => select(cur+1));
    document.getElementById('cnum').textContent = pad(cur);
    document.querySelectorAll('.goal-btn').forEach(b => b.setAttribute('aria-current', String(+b.dataset.goal === cur)));
  }

  function applyLang(){
    document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.getElementById('lang-en').setAttribute('aria-pressed', String(lang==='en'));
    document.getElementById('lang-ar').setAttribute('aria-pressed', String(lang==='ar'));
    document.getElementById('pagefoot').textContent = t('foot');
    renderRail(); renderPanel();
  }
  function select(n){ if (n < 1 || n > 17) return; cur = n; history.replaceState(null, '', '#goal-' + n); renderPanel(); const p = document.getElementById('panel'); if (window.innerWidth < 760) p.scrollIntoView({block:'start'}); }
  document.getElementById('lang-en').addEventListener('click', () => { lang='en'; try{localStorage.setItem('sdg-lang','en')}catch(e){} applyLang(); });
  document.getElementById('lang-ar').addEventListener('click', () => { lang='ar'; try{localStorage.setItem('sdg-lang','ar')}catch(e){} applyLang(); });
  applyLang();
})();
</script>


<script>
(function(){
  function sendHeight(){
    try{
      var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);
      window.parent.postMessage({type:'iesg-sdg-height',height:h},'*');
    }catch(e){}
  }
  window.addEventListener('load',function(){setTimeout(sendHeight,50);setTimeout(sendHeight,400)});
